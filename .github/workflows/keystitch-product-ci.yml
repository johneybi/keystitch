name: KeyStitch product foundation

on:
  push:
    branches: [codex/ime-f19-regression]
  pull_request:
    branches: [codex/ime-f19-regression]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Internal candidate artifacts only. These jobs do not publish releases, install a service,
# inject OS input, or certify a release's minimum OS / IME compatibility.
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: brew install ninja openssl@3
      - name: Test package audit policy
        run: |
          python3 tools/release/test_audit_macos_bundle.py
          python3 tools/release/test_verify_build.py
          python3 tools/release/test_build_metadata.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DINPUTLEAP_BUILD_GUI=ON -DINPUTLEAP_BUILD_TESTS=ON \
            -DINPUTLEAP_BUILD_AUDIO_DAEMON=OFF
      - name: Build desktop app, engines and tests
        run: cmake --build build --parallel 3 --target input-leap input-leapc input-leaps unittests desktopunittests guiunittests
      - name: Run all unit suites
        run: ctest --test-dir build --output-on-failure -R '^(unittests|desktopunittests|guiunittests)$'
      - name: Package isolated macOS candidate
        env:
          INPUTLEAP_MINIMUM_MACOS: '26.0'
        run: |
          mkdir -p build/candidate
          sh dist/macos/package_keymap_gui.sh \
            build/bin/input-leap build/bin/input-leapc build/bin/input-leaps \
            build/candidate/KeyStitch.app
          ditto -c -k --sequesterRsrc --keepParent build/candidate/KeyStitch.app build/candidate/KeyStitch-macOS.zip
          shasum -a 256 build/candidate/KeyStitch-macOS.zip > build/candidate/SHA256SUMS
      - name: Upload macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: keystitch-macos-candidate-${{ github.sha }}
          path: |
            build/candidate/*.zip
            build/candidate/*.json
            build/candidate/SHA256SUMS
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-macos-test-evidence
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: Download existing Bonjour build dependency
        id: bonjour
        shell: pwsh
        run: |
          python tools/release/stage_bonjour_sdk.py deps/BonjourSDKLike
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT
      - name: Test package audit policy
        run: |
          python tools/release/test_audit_macos_bundle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release/test_verify_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release/test_build_metadata.py
      - name: Configure
        shell: pwsh
        env:
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DQT_DEFAULT_MAJOR_VERSION=6 `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/build/install" `
            -DINPUTLEAP_BUILD_GUI=ON -DINPUTLEAP_BUILD_TESTS=ON `
            -DINPUTLEAP_BUILD_AUDIO_DAEMON=OFF `
            -DDNSSD_LIB="${{ steps.bonjour.outputs.path }}\Lib\x64\dnssd.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop app, engines and tests
        run: cmake --build build --config Release --parallel 3 --target input-leap input-leapc input-leaps input-leapd unittests desktopunittests guiunittests
      - name: Run all unit suites
        run: ctest --test-dir build -C Release --output-on-failure -R '^(unittests|desktopunittests|guiunittests)$'
      - name: Stage and verify Windows candidate
        shell: pwsh
        run: |
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE build/install/LICENSE.txt
          # Probe with developer Qt paths removed: staged files must load on their own.
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python tools/release/verify_build.py build/install `
            --expected-revision "$env:GITHUB_SHA" --platform Windows --output build/windows-build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows installer without installing
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler build/installer-inno/input-leap.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/installer-inno/bin/*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content build/windows-SHA256SUMS
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: keystitch-windows-candidate-${{ github.sha }}
          path: |
            build/installer-inno/bin/*.exe
            build/windows-build.json
            build/windows-SHA256SUMS
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-windows-test-evidence
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows-install:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keystitch-windows-candidate-${{ github.sha }}
          path: candidate
      - name: Install, reinstall and uninstall the packaged candidate
        run: python tools/release/test_windows_installer.py candidate install-evidence
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-windows-install-evidence
          path: install-evidence/
          if-no-files-found: warn

  windows-upgrade:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keystitch-windows-candidate-${{ github.sha }}
          path: candidate
      - name: Exercise the v0.1.0 to candidate transition
        run: python tools/release/test_windows_upgrade.py candidate upgrade-evidence
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-windows-upgrade-evidence
          path: upgrade-evidence/
          if-no-files-found: warn
